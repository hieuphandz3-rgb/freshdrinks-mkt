<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Quản Lý Đơn Hàng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-backdrop.active { display: flex; }
    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      max-width: 540px;
      width: 90%;
      padding: 24px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <h3><i class="fa-solid fa-mug-hot"></i> FreshDrinks</h3>
      <ul class="admin-nav">
        <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        <li><a href="categories.html"><i class="fa-solid fa-tags"></i> Quản lý Danh mục</a></li>
        <li><a href="products.html"><i class="fa-solid fa-mug-saucer"></i> Quản lý Sản phẩm</a></li>
        <li><a href="users.html"><i class="fa-solid fa-users"></i> Khách hàng</a></li>
        <li><a href="orders.html" class="active"><i class="fa-solid fa-receipt"></i> Đơn hàng</a></li>
        <li><a href="seo.html"><i class="fa-solid fa-magnifying-glass-chart"></i> Cấu hình SEO & FB</a></li>
        <li><a href="../index.html" style="color:#ef4444; margin-top: auto;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Thoát Admin</a></li>
      </ul>
    </aside>

    <main class="admin-view-panel">
      <div class="admin-header-title">
        <h1><i class="fa-solid fa-receipt" style="color:var(--admin-primary-dark);"></i> Quản Lý Đơn Hàng </h1>
      </div>

      <div class="admin-table-card">
        <table class="cart-table">
          <thead>
            <tr>
              <th>Mã Đơn</th>
              <th>Khách Hàng</th>
              <th>Số Điện Thoại</th>
              <th>Tổng Tiền</th>
              <th>Trạng Thái</th>
              <th>Thao Tác</th>
            </tr>
          </thead>
          <tbody id="orderTbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-backdrop"></div>

  <script src="../js/data.js"></script>
  <script>
    async function renderOrderTable() {
      const orders = await apiGetOrders();
      const tbody = document.getElementById('orderTbody');
      if (!orders || orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">Chưa có đơn hàng nào trong db.json!</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td><strong style="color:#0f172a; font-family:monospace; font-size:14px;">${o.id}</strong></td>
          <td><strong>${o.customer}</strong></td>
          <td>${o.phone || 'Chưa cập nhật'}</td>
          <td><strong style="color:#b45309; font-size:15px;">${Number(o.total).toLocaleString('vi-VN')} đ</strong></td>
          <td>
            <span style="background:${o.status === 'Đã hoàn thành' ? '#dcfce7; color:#166534' : '#fef3c7; color:#b45309'}; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700;">
              ${o.status || 'Đang giao'}
            </span>
          </td>
          <td>
            <button class="btn-action-edit" onclick="showOrderDetail('${o.id}')">
              <i class="fa-solid fa-eye"></i> Chi tiết
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function showOrderDetail(orderId) {
      const orders = await apiGetOrders();
      const order = orders.find(o => String(o.id) === String(orderId));
      if (!order) return;

      const modal = document.getElementById("modalOverlay");
      modal.innerHTML = `
        <div class="modal-content">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:18px;">Chi Tiết Đơn Hàng: ${order.id}</h3>
            <button onclick="document.getElementById('modalOverlay').classList.remove('active')" style="border:none;background:none;font-size:24px;cursor:pointer;">&times;</button>
          </div>
          <p>Khách hàng: <strong>${order.customer}</strong> (${order.phone || ''})</p>
          <p>Địa chỉ nhận: <strong>${order.address || 'Tại quầy'}</strong></p>
          <p>Ngày đặt: <strong>${order.date || ''}</strong></p>
          <hr style="margin:14px 0; border:none; border-top:1px solid #e5e7eb;"/>
          <h4 style="margin-bottom:8px;">Danh sách đồ uống:</h4>
          <div style="max-height:180px; overflow-y:auto;">
            ${order.items.map(i => `
              <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                <span>${i.name} <strong>x${i.qty}</strong></span>
                <strong>${(i.price * i.qty).toLocaleString('vi-VN')} đ</strong>
              </div>
            `).join('')}
          </div>
          <hr style="margin:14px 0; border:none; border-top:1px solid #e5e7eb;"/>
          <h3 style="text-align:right; color:#b45309;">Tổng thanh toán: ${Number(order.total).toLocaleString('vi-VN')} đ</h3>
        </div>
      `;
      modal.classList.add("active");
    }

    document.addEventListener("DOMContentLoaded", renderOrderTable);
  </script>
</body>
</html>
